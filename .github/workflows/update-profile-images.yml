name: Update profile progress SVGs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit generated SVGs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci || npm i

      - name: Run generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: raykaris
          COMMITS_GOAL: 5000
          STARS_GOAL: 200
          REPOS_GOAL: 100
        run: node scripts/generate-progress-svg.js

      - name: Commit and push assets if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): update progress SVGs"
            git push
          else
            echo "No changes to commit"
          fi
